name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: finfamily_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest, PostgreSQL Parity & Concurrency Suite
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql://postgres:postgrespassword@localhost:5432/finfamily_test"
          JWT_SECRET: "test-ci-secret-key-at-least-32-bytes-secure"
          GOOGLE_CLIENT_ID: "100000000000-dummyclientidforci.apps.googleusercontent.com"
          APP_VERSION: "1.1.2"
          APP_BUILD_NUMBER: "10"
        run: |
          pytest test_*.py -v
